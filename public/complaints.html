<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaints · Hostel Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <main>
    <section class="card chat-card">
      <div id="messages" class="messages"></div>

      <div class="composer-tools">
        <select id="category">
          <option>Food</option>
          <option>Clothes</option>
          <option>Washrooms</option>
          <option>Rules</option>
          <option>Other</option>
        </select>
        <label class="tag-toggle">
          <input id="tag" type="checkbox">
          Tag proctor
        </label>
      </div>

      <div class="composer">
        <textarea id="message" rows="1" maxlength="300" placeholder="Describe the problem"></textarea>
        <button id="post-btn">Post</button>
      </div>
      <p id="status"></p>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="complaints.js"></script>
</body>
</html>
