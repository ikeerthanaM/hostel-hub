<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Hostel Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Hostel Hub</h1>
    <p>Attendance, food, going-home plans and a safe voice for every student.</p>
  </header>

  <main>
    <section id="join" class="card">
      <h2>Join Hostel Hub</h2>

      <label for="invite">Invite code</label>
      <input id="invite" type="text" placeholder="HUB-4F7K">

      <label for="username">Username</label>
      <input id="username" type="text" placeholder="Choose a username">

      <label for="pin">PIN</label>
      <input id="pin" type="password" inputmode="numeric" placeholder="4 to 6 digits">

      <button id="join-btn">Request to join</button>
      <p id="status">Status: not sent yet</p>
    </section>
  </main>

  <footer>
    <p>Hostel Hub · Working title</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
