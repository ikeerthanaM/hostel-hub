<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proctor check · Hostel Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Proctor check</h1>
    <p>Students with a problem today. Call them if something looks wrong.</p>
  </header>

  <main>
    <section class="card">
      <p id="date" class="meta"></p>
      <button id="refresh">Refresh</button>
      <p id="summary"></p>
    </section>

    <section class="card">
      <h2>End-of-day spreadsheets</h2>
      <p class="meta">Log in as the proctor first. The files open in Google Sheets or Excel.</p>
      <a class="button-link" href="/export/attendance.csv" download>Download attendance</a>
      <a class="button-link" href="/export/movements.csv" download>Download check out / in</a>
    </section>

    <div id="list"></div>
  </main>

  <script src="common.js"></script>
  <script src="proctor.js"></script>
</body>
</html>
