<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food · Hostel Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Food</h1>
  </header>

  <main>
    <section id="proctor-panel" class="card" hidden>
      <h2>Add a poll</h2>

      <label for="p-date">Food is for</label>
      <input id="p-date" type="date">

      <label for="p-close">Closes at (Indian time)</label>
      <input id="p-close" type="datetime-local">

      <button id="p-meals">Add Meals poll</button>
      <button id="p-snack" class="secondary">Add Snack poll</button>
      <button id="p-veg" class="secondary">Add Veg / Non-veg poll</button>
      <p id="p-status" class="meta"></p>
    </section>

    <p id="food-status" class="meta"></p>
    <div id="polls"></div>
  </main>

  <script src="common.js"></script>
  <script src="poll.js"></script>
</body>
</html>
